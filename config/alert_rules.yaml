alerts:
  - name: HighRequestLatency
    severity: warning
    condition: "latency_p95_ms > 3000"
    duration: 5m
    type: symptom-based
    channel: slack
    owner: student-2A202602929
    runbook: docs/alerts.md#alert-1
  - name: ElevatedRequestErrors
    severity: critical
    condition: "error_rate_pct > 2"
    duration: 5m
    type: symptom-based
    channel: slack
    owner: student-2A202602929
    runbook: docs/alerts.md#alert-2
  - name: LowRetrievalSuccess
    severity: critical
    condition: "retrieval_success_rate_pct < 90"
    duration: 5m
    type: symptom-based
    channel: slack
    owner: student-2A202602929
    runbook: docs/alerts.md#alert-3
